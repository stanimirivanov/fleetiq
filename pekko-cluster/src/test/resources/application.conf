# Pekko Test Configuration
pekko {
  actor {
    provider = "local"
    serializers {
      jackson-json = "io.fleetiq.pekko.serialization.JacksonSerializer"
    }
    serialization-bindings {
      "io.fleetiq.pekko.serialization.CborSerializable" = jackson-json
    }
  }

  # Use in-memory journal and snapshot store for tests
  persistence {
    journal.plugin = "inmemory-journal"
    snapshot-store.plugin = "inmemory-snapshot-store"
  }
}

# In-memory journal for testing
inmemory-journal {
  class = "org.apache.pekko.persistence.journal.inmem.InmemoryJournal"
}

inmemory-snapshot-store {
  class = "org.apache.pekko.persistence.snapshot.inmem.InmemorySnapshotStore"
}
