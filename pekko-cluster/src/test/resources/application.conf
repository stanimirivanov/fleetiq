# Pekko Test Configuration
pekko {
  actor {
    provider = "local"
    serialization-bindings {
      "io.fleetiq.pekko.serialization.CborSerializable" = jackson-cbor
    }
  }

  # Use Pekko's built-in in-memory journal and local snapshot store for tests.
  persistence {
    journal.plugin = "pekko.persistence.journal.inmem"
    journal.auto-start-journals = []
    snapshot-store.plugin = "pekko.persistence.snapshot-store.local"
  }
}

pekko.persistence.snapshot-store.local {
  dir = "target/test-snapshots"
}
