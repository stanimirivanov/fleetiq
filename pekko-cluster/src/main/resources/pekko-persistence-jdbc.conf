# Pekko Persistence JDBC Configuration
# Included from application.conf

pekko-persistence-jdbc {
  # Shared database configuration for all journals
  shared-databases {
    slick {
      profile = "slick.jdbc.PostgresProfile$"
      db {
        host = "localhost"
        host = ${?PEKKO_JDBC_HOST}
        port = 5432
        port = ${?PEKKO_JDBC_PORT}
        name = "pekko_journal_db"
        name = ${?PEKKO_JDBC_DB}

        url = "jdbc:postgresql://"${pekko-persistence-jdbc.shared-databases.slick.db.host}":"${pekko-persistence-jdbc.shared-databases.slick.db.port}"/"${pekko-persistence-jdbc.shared-databases.slick.db.name}
        user = "fleetiq"
        user = ${?PEKKO_JDBC_USER}
        password = "fleetiq_dev"
        password = ${?PEKKO_JDBC_PASSWORD}

        driver = "org.postgresql.Driver"
        numThreads = 10
        maxConnections = 10
        minConnections = 2
      }
    }
  }
}

# Journal configuration
pekko.persistence {
  journal {
    plugin = "jdbc-journal"
    auto-start-journals = ["jdbc-journal"]
  }

  snapshot-store {
    plugin = "jdbc-snapshot-store"
  }
}

jdbc-journal {
  use-shared-db = "slick"
  tables {
    journal {
      tableName = "event_journal"
      schemaName = "public"
    }
  }
}

jdbc-snapshot-store {
  use-shared-db = "slick"
  tables {
    snapshot {
      tableName = "snapshot_store"
      schemaName = "public"
    }
  }
}

jdbc-read-journal {
  use-shared-db = "slick"
  tables {
    journal {
      tableName = "event_journal"
      schemaName = "public"
    }
  }
}
