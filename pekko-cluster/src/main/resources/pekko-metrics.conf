# Pekko Cluster Metrics Configuration
pekko {
  cluster {
    metrics {
      enabled = on
      periodic-tasks-initial-delay = 5s
    }
  }

  actor {
    provider = "cluster"

    # Log cluster events
    loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
    logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

    debug {
      lifecycle = off
      receive = off
      event-stream = off
    }
  }
}
