# FleetIQ Pekko Cluster Configuration

pekko {
  actor {
    provider = "cluster"
    serializers {
      jackson-json = "io.fleetiq.pekko.serialization.JacksonSerializer"
    }
    serialization-bindings {
      "io.fleetiq.pekko.serialization.CborSerializable" = jackson-json
    }
  }

  cluster {
    # Kubernetes API discovery (will be configured in Phase 5)
    # For local dev, use static seed nodes
    seed-nodes = [
      "pekko://fleetiq-cluster@localhost:2551"
    ]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }

  remote.artery {
    canonical.hostname = "localhost"
    canonical.hostname = ${?PEKKO_HOST}
    canonical.port = 2551
    canonical.port = ${?PEKKO_PORT}
  }

  # Include JDBC persistence config
  # (implicitly loaded from pekko-persistence-jdbc.conf on classpath)
}
