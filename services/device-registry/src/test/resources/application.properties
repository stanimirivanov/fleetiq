quarkus.datasource.devservices.enabled=true
# Use TimescaleDB image because it has PostgreSQL 16 with extension support
# AGE and PostGIS must be enabled via init script
quarkus.datasource.devservices.image-name=timescale/timescaledb:2.16.1-pg16
quarkus.datasource.devservices.init-script-path=src/test/resources/db/init-test-db.sql
quarkus.datasource.devservices.port=15434

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.grpc.server.port=0

quarkus.otel.sdk.disabled=false
quarkus.otel.logs.exporter=logging

quarkus.log.level=INFO
quarkus.log.category."io.fleetiq".level=DEBUG
