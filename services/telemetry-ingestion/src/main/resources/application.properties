# Service Identity
quarkus.application.name=telemetry-ingestion
quarkus.application.version=0.1.0

# HTTP
quarkus.http.port=8081

# gRPC
quarkus.grpc.server.port=9001
quarkus.grpc.server.use-separate-server=false
quarkus.oidc.auth-server-url=${FLEETIQ_OIDC_URL:http://localhost:8180/realms/fleetiq}
quarkus.oidc.client-id=fleetiq-services
quarkus.oidc.application-type=service
quarkus.generate-code.grpc.scan-for-imports=true
quarkus.generate-code.grpc.scan-for-proto=telemetry/v1/ingestion.proto

# Database — TimescaleDB
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=fleetiq
quarkus.datasource.password=fleetiq_dev
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/telemetry_db
%prod.quarkus.datasource.reactive.url=postgresql://localhost:5432/telemetry_db
quarkus.datasource.reactive.max-size=20

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# MQTT ingestion
mp.messaging.incoming.telemetry-in.connector=smallrye-mqtt
mp.messaging.incoming.telemetry-in.host=${FLEETIQ_MQTT_HOST:localhost}
mp.messaging.incoming.telemetry-in.port=${FLEETIQ_MQTT_PORT:1883}
mp.messaging.incoming.telemetry-in.topic=fleetiq/+/+/telemetry
mp.messaging.incoming.telemetry-in.qos=1
mp.messaging.incoming.telemetry-in.client-id=telemetry-ingestion
mp.messaging.incoming.telemetry-in.username=${FLEETIQ_MQTT_USERNAME:telemetry-ingestion}
mp.messaging.incoming.telemetry-in.password=${FLEETIQ_MQTT_PASSWORD:telemetry-ingestion-dev}
mp.messaging.outgoing.position-projections-out.connector=smallrye-mqtt
mp.messaging.outgoing.position-projections-out.host=${FLEETIQ_MQTT_HOST:localhost}
mp.messaging.outgoing.position-projections-out.port=${FLEETIQ_MQTT_PORT:1883}
mp.messaging.outgoing.position-projections-out.topic=fleetiq/events/position-projections
mp.messaging.outgoing.position-projections-out.qos=1
mp.messaging.outgoing.position-projections-out.username=${FLEETIQ_MQTT_USERNAME:telemetry-ingestion}
mp.messaging.outgoing.position-projections-out.password=${FLEETIQ_MQTT_PASSWORD:telemetry-ingestion-dev}

# OpenTelemetry
quarkus.otel.exporter.otlp.endpoint=http://localhost:4319
quarkus.otel.service.name=telemetry-ingestion

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.fleetiq".level=DEBUG
