# Service Identity
quarkus.application.name=telemetry-ingestion
quarkus.application.version=0.1.0

# HTTP
quarkus.http.port=8081

# gRPC
quarkus.grpc.server.port=9001
quarkus.generate-code.grpc.scan-for-imports=true
quarkus.generate-code.grpc.scan-for-proto=telemetry/v1/ingestion.proto

# Database — TimescaleDB
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=fleetiq
quarkus.datasource.password=fleetiq_dev
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/telemetry_db
quarkus.datasource.reactive.url=postgresql://localhost:5432/telemetry_db
quarkus.datasource.reactive.max-size=20

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# OpenTelemetry
quarkus.otel.exporter.otlp.endpoint=http://localhost:4319
quarkus.otel.service.name=telemetry-ingestion

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.fleetiq".level=DEBUG
