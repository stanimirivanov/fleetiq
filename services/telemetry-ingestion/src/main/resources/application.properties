# Service Identity
quarkus.application.name=telemetry-ingestion
quarkus.application.version=0.1.0

# HTTP
quarkus.http.port=8081

# gRPC
quarkus.grpc.server.port=9001

# MQTT Ingest
quarkus.messaging.mqtt.telemetry-ingest.host=localhost
quarkus.messaging.mqtt.telemetry-ingest.port=1883
quarkus.messaging.mqtt.telemetry-ingest.topic=fleetiq/+/telemetry
quarkus.messaging.mqtt.telemetry-ingest.qos=1
quarkus.messaging.mqtt.telemetry-ingest.client-id=telemetry-ingestion-${quarkus.uuid}

# Database — TimescaleDB
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=fleetiq
quarkus.datasource.password=fleetiq_dev
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/telemetry_db
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# OpenTelemetry
quarkus.otel.exporter.otlp.endpoint=http://localhost:4319
quarkus.otel.service.name=telemetry-ingestion

# Health
quarkus.health.extensions.enabled=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.fleetiq".level=DEBUG

# Dev mode profile overrides
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/telemetry_db
