# Test profile — uses Testcontainers for PostgreSQL
# Quarkus Dev Services auto-starts a TimescaleDB container

# Database
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=timescale/timescaledb:2.16.1-pg16
quarkus.datasource.devservices.db-name=telemetry_tenant_test
quarkus.datasource.devservices.init-script-path=db/init-test-db.sql

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Disable external dependencies during tests
quarkus.grpc.server.port=0
quarkus.oidc.enabled=false
mp.messaging.incoming.telemetry-in.enabled=false
mp.messaging.outgoing.position-projections-out.enabled=false
quarkus.scheduler.enabled=false

# OpenTelemetry — export to console for test visibility
quarkus.otel.sdk.disabled=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.fleetiq".level=DEBUG
quarkus.log.category."org.testcontainers".level=INFO
