# Service Identity
quarkus.application.name=maintenance-predictor
quarkus.application.version=0.1.0

# HTTP
quarkus.http.port=8084

# gRPC
quarkus.grpc.server.port=9004
quarkus.grpc.server.use-separate-server=false
quarkus.oidc.auth-server-url=${FLEETIQ_OIDC_URL:http://localhost:8180/realms/fleetiq}
quarkus.oidc.client-id=fleetiq-services
quarkus.oidc.application-type=service
quarkus.generate-code.grpc.scan-for-imports=true
quarkus.generate-code.grpc.scan-for-proto=maintenance/v1/predictor.proto
quarkus.grpc.clients.telemetry.host=${FLEETIQ_TELEMETRY_HOST:localhost}
quarkus.grpc.clients.telemetry.port=${FLEETIQ_TELEMETRY_PORT:9001}
quarkus.grpc.clients.telemetry.plain-text=true
fleetiq.ai.ollama.base-url=${FLEETIQ_OLLAMA_URL:http://localhost:11434}
fleetiq.ai.ollama.model=${FLEETIQ_CHAT_MODEL:qwen2.5:1.5b}
fleetiq.maintenance.publication-threshold=${FLEETIQ_RECOMMENDATION_THRESHOLD:0.8}
mp.messaging.outgoing.maintenance-recommendations-out.connector=smallrye-mqtt
mp.messaging.outgoing.maintenance-recommendations-out.host=${FLEETIQ_MQTT_HOST:localhost}
mp.messaging.outgoing.maintenance-recommendations-out.port=${FLEETIQ_MQTT_PORT:1883}
mp.messaging.outgoing.maintenance-recommendations-out.topic=fleetiq/events/maintenance-recommendations
mp.messaging.outgoing.maintenance-recommendations-out.qos=1
mp.messaging.outgoing.maintenance-recommendations-out.username=${FLEETIQ_MQTT_USERNAME:maintenance-predictor}
mp.messaging.outgoing.maintenance-recommendations-out.password=${FLEETIQ_MQTT_PASSWORD:maintenance-predictor-dev}

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=fleetiq
quarkus.datasource.password=fleetiq_dev
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/maintenance_db
%prod.quarkus.datasource.reactive.url=postgresql://localhost:5432/maintenance_db
quarkus.datasource.reactive.max-size=10
quarkus.hibernate-orm.mapping.format.global=ignore

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# OpenTelemetry
quarkus.otel.exporter.otlp.endpoint=http://localhost:4319
quarkus.otel.service.name=maintenance-predictor

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.fleetiq".level=DEBUG
