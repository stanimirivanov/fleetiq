quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16-alpine
quarkus.datasource.devservices.port=15433

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.grpc.server.port=0

quarkus.otel.sdk.disabled=false
quarkus.otel.logs.exporter=logging

quarkus.log.level=INFO
quarkus.log.category."io.fleetiq".level=DEBUG
