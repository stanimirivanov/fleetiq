quarkus.application.name=streaming-hub
quarkus.application.version=0.1.0
quarkus.http.port=8085
quarkus.grpc.server.port=9005
quarkus.grpc.server.use-separate-server=false
quarkus.oidc.auth-server-url=${FLEETIQ_OIDC_URL:http://localhost:8180/realms/fleetiq}
quarkus.oidc.client-id=fleetiq-services
quarkus.oidc.application-type=service

mp.messaging.incoming.positions-in.connector=smallrye-mqtt
mp.messaging.incoming.positions-in.host=localhost
mp.messaging.incoming.positions-in.port=1883
mp.messaging.incoming.positions-in.topic=fleetiq/+/telemetry
mp.messaging.incoming.positions-in.qos=1
mp.messaging.incoming.positions-in.client-id=fleetiq-streaming-hub
mp.messaging.incoming.positions-in.broadcast=true

# No database needed — stateless service
# Connects to Pekko cluster for state

quarkus.otel.exporter.otlp.endpoint=http://localhost:4319
quarkus.otel.service.name=streaming-hub

quarkus.log.level=INFO
quarkus.log.category."io.fleetiq".level=DEBUG
