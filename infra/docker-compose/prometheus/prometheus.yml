global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    cluster: fleetiq-local

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: telemetry-ingestion
    metrics_path: /q/metrics
    static_configs:
      - targets:
          - host.docker.internal:8081
        labels:
          service: telemetry-ingestion

  - job_name: device-registry
    metrics_path: /q/metrics
    static_configs:
      - targets:
          - host.docker.internal:8082
        labels:
          service: device-registry

  - job_name: fleet-topology
    metrics_path: /q/metrics
    static_configs:
      - targets:
          - host.docker.internal:8083
        labels:
          service: fleet-topology

  - job_name: maintenance-predictor
    metrics_path: /q/metrics
    static_configs:
      - targets:
          - host.docker.internal:8084
        labels:
          service: maintenance-predictor

  - job_name: streaming-hub
    metrics_path: /q/metrics
    static_configs:
      - targets:
          - host.docker.internal:8085
        labels:
          service: streaming-hub
