# FleetIQ MQTT Broker Configuration

# Listeners
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener for browser-based debugging tools
listener 9001 0.0.0.0
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection limits
max_connections 1000
max_keepalive 300

# QoS limits
max_inflight_messages 100
max_queued_messages 1000

# Password authentication and topic ACLs are generated by start-secure.sh.
allow_anonymous false
password_file /mosquitto/runtime/passwords
acl_file /mosquitto/runtime/acl

# Production should additionally use:
# - TLS with client certificates
# - Bridge to cloud MQTT service

# Topic structure for FleetIQ:
# fleetiq/{tenant}/{vin}/telemetry — Device to platform (QoS 1)
# fleetiq/{vin}/command          — Platform to device (QoS 1)
# fleetiq/{vin}/command/response — Device to platform (QoS 1)
# fleetiq/+/status               — Status updates (QoS 0)
