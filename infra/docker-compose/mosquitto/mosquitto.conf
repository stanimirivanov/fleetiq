# FleetIQ MQTT Broker Configuration

# Listeners
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener for browser-based debugging tools
listener 9001 0.0.0.0
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection limits
max_connections 1000
max_keepalive 300

# QoS limits
max_inflight_messages 100
max_queued_messages 1000

# Authentication (disabled for dev — will use mTLS in production)
allow_anonymous true

# Bridge and ACL disabled for local development
# Production would use:
# - TLS with client certificates
# - ACL file for topic authorization
# - Bridge to cloud MQTT service

# Topic structure for FleetIQ:
# fleetiq/{vin}/telemetry        — Device to platform (QoS 1)
# fleetiq/{vin}/command          — Platform to device (QoS 1)
# fleetiq/{vin}/command/response — Device to platform (QoS 1)
# fleetiq/+/status               — Status updates (QoS 0)
