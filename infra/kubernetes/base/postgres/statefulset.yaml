apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fleetiq
  labels:
    app: postgres
    component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        component: database
    spec:
      initContainers:
        - name: init-extensions
          image: timescale/timescaledb:2.16.1-pg16
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          command:
            - /bin/bash
            - -c
            - |
              # The actual extension setup is handled by the entrypoint
              # after the data directory is ready.
              # This init container ensures the configmap SQL is executed.
              cp /docker-entrypoint-initdb.d/*.sql /init-scripts/
              echo "Init scripts copied"
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      containers:
        - name: postgres
          image: timescale/timescaledb:2.16.1-pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "telemetry_db,device_registry_db,topology_db,maintenance_db,pekko_journal_db,keycloak_db"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - fleetiq
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - fleetiq
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
        - name: postgres-config
          configMap:
            name: postgres-config
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
