apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fleetiq

resources:
  # Platform-owned resources
  - namespace.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/configmap.yaml
  - postgres/secrets.yaml
  - mosquitto/deployment.yaml
  - mosquitto/service.yaml
  - mosquitto/configmap.yaml
  - mosquitto/credentials-secret.yaml
  - keycloak/deployment.yaml
  - keycloak/service.yaml
  - monitoring/otel-collector.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml
  - istio/gateway.yaml
  - istio/peer-authentication.yaml
  - istio/destination-rules.yaml
  - auth/request-authentication.yaml
  - auth/authorization-policy.yaml
  - services/service-accounts.yaml

  # Workload-owned, independently buildable bases
  - services/telemetry-ingestion
  - services/device-registry
  - services/fleet-topology
  - services/maintenance-predictor
  - services/streaming-hub
  - services/pekko-cluster

commonLabels:
  app.kubernetes.io/part-of: fleetiq
  app.kubernetes.io/managed-by: kustomize
