# Global circuit breaking defaults
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: fleetiq-circuit-breaker
  namespace: fleetiq
spec:
  host: "*.fleetiq.svc.cluster.local"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 3s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 200
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
---
# Specific rule for telemetry-ingestion (high throughput)
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: telemetry-ingestion-dr
  namespace: fleetiq
spec:
  host: telemetry-ingestion.fleetiq.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 500
      http:
        http2MaxRequests: 1000
    outlierDetection:
      consecutive5xxErrors: 10
      interval: 15s
      baseEjectionTime: 15s
---
# Pekko cluster — no circuit breaking for internal cluster communication
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: pekko-cluster-dr
  namespace: fleetiq
spec:
  host: pekko-cluster.fleetiq.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 500
