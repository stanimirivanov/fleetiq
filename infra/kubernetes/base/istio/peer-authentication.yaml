apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: fleetiq-mtls-strict
  namespace: fleetiq
spec:
  mtls:
    mode: STRICT
---
# Pekko cluster needs mTLS but with specific SPIFFE IDs
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: pekko-cluster-mtls
  namespace: fleetiq
spec:
  selector:
    matchLabels:
      app: pekko-cluster
  mtls:
    mode: STRICT
  portLevelMtls:
    2551:  # Pekko remoting port
      mode: PERMISSIVE  # Allow Pekko's own TLS alongside Istio
