apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: fleetiq-gateway
  namespace: fleetiq
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "fleetiq.local"
        - "*.fleetiq.local"
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "fleetiq.local"
        - "*.fleetiq.local"
      tls:
        mode: SIMPLE
        credentialName: fleetiq-tls-cert
    - port:
        number: 9000
        name: grpc
        protocol: GRPC
      hosts:
        - "*"
      tls:
        mode: ISTIO_MUTUAL
