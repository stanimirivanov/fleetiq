apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: fleetiq
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    protocol mqtt

    persistence true
    persistence_location /mosquitto/data/

    log_dest stdout
    log_type error
    log_type warning
    log_type notice

    max_connections 1000
    max_keepalive 300
    max_inflight_messages 100
    max_queued_messages 1000

    allow_anonymous true
