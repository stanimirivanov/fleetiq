apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: fleetiq
  labels:
    app: mosquitto
    component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
        component: messaging
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          command: ["/bin/sh", "/mosquitto/config/start-secure.sh"]
          env:
            - name: TELEMETRY_INGESTION_PASSWORD
              valueFrom: {secretKeyRef: {name: mqtt-credentials, key: telemetry-ingestion-password}}
            - name: DEVICE_REGISTRY_PASSWORD
              valueFrom: {secretKeyRef: {name: mqtt-credentials, key: device-registry-password}}
            - name: FLEET_TOPOLOGY_PASSWORD
              valueFrom: {secretKeyRef: {name: mqtt-credentials, key: fleet-topology-password}}
            - name: STREAMING_HUB_PASSWORD
              valueFrom: {secretKeyRef: {name: mqtt-credentials, key: streaming-hub-password}}
          ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 9001
              name: websocket
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: config
              mountPath: /mosquitto/config/start-secure.sh
              subPath: start-secure.sh
            - name: runtime
              mountPath: /mosquitto/runtime
            - name: data
              mountPath: /mosquitto/data
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: data
          emptyDir: {}
        - name: runtime
          emptyDir: {}
