apiVersion: v1
kind: ConfigMap
metadata:
  name: streaming-hub-config
  namespace: fleetiq
data:
  application.properties: |
    quarkus.application.name=streaming-hub
    quarkus.http.port=8085
    quarkus.grpc.server.use-separate-server=false
    quarkus.oidc.auth-server-url=http://keycloak.fleetiq.svc.cluster.local:8080/realms/fleetiq
    quarkus.oidc.client-id=fleetiq-services
    quarkus.oidc.application-type=service
    quarkus.otel.exporter.otlp.endpoint=http://otel-collector.fleetiq.svc.cluster.local:4317
    quarkus.otel.service.name=streaming-hub
