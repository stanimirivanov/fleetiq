apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-ingestion-config
  namespace: fleetiq
data:
  application.properties: |
    quarkus.application.name=telemetry-ingestion
    quarkus.http.port=8081
    quarkus.grpc.server.port=9001

    quarkus.datasource.jdbc=false
    quarkus.datasource.reactive.url=jdbc:postgresql://postgres.fleetiq.svc.cluster.local:5432/telemetry_db
    quarkus.flyway.migrate-at-start=true

    quarkus.messaging.mqtt.telemetry-ingest.host=mosquitto.fleetiq.svc.cluster.local
    quarkus.messaging.mqtt.telemetry-ingest.port=1883
    quarkus.messaging.mqtt.telemetry-ingest.topic=fleetiq/+/telemetry
    quarkus.messaging.mqtt.telemetry-ingest.qos=1

    quarkus.otel.exporter.otlp.endpoint=http://otel-collector.fleetiq.svc.cluster.local:4317
    quarkus.otel.service.name=telemetry-ingestion

    quarkus.log.level=INFO
