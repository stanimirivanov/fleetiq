apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-predictor-config
  namespace: fleetiq
data:
  application.properties: |
    quarkus.application.name=maintenance-predictor
    quarkus.http.port=8084
    quarkus.grpc.server.port=9004
    quarkus.datasource.jdbc=false
    quarkus.datasource.reactive.url=jdbc:postgresql://postgres.fleetiq.svc.cluster.local:5432/maintenance_db
    quarkus.flyway.migrate-at-start=true
    quarkus.otel.exporter.otlp.endpoint=http://otel-collector.fleetiq.svc.cluster.local:4317
    quarkus.otel.service.name=maintenance-predictor
