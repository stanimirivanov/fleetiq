apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: maintenance-predictor
  namespace: fleetiq
  labels:
    app: maintenance-predictor
    component: ai
  annotations:
    autoscaling.knative.dev/min-scale: "0"
    autoscaling.knative.dev/max-scale: "3"
    autoscaling.knative.dev/target: "10"
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        argocd-image-updater.argoproj.io/image-list: telemetry-ingestion=ghcr.io/fleetiq/telemetry-ingestion
        argocd-image-updater.argoproj.io/update-strategy: semver
    spec:
      serviceAccountName: maintenance-predictor
      containers:
        - image: ghcr.io/fleetiq/maintenance-predictor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
              name: http
            - containerPort: 9004
              name: grpc
          env:
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
