apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: maintenance-predictor-vs
  namespace: fleetiq
spec:
  hosts:
    - maintenance-predictor.fleetiq.svc.cluster.local
  http:
    - match:
        - port: 8084
      route:
        - destination:
            host: maintenance-predictor.fleetiq.svc.cluster.local
            port:
              number: 8084
      timeout: 120s  # AI predictions can take time
