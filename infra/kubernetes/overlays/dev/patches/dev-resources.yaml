# Reduce resource requests for development
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: telemetry-ingestion
spec:
  template:
    spec:
      containers:
        - name: user-container
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
