quarkus.application.name=vehicle-simulator
quarkus.application.version=0.1.0
fleetiq.simulator.tenant-id=${FLEETIQ_TENANT_ID:demo}

# MQTT publisher
mp.messaging.outgoing.telemetry-out.connector=smallrye-mqtt
mp.messaging.outgoing.telemetry-out.host=${FLEETIQ_MQTT_HOST:localhost}
mp.messaging.outgoing.telemetry-out.port=${FLEETIQ_MQTT_PORT:1883}
mp.messaging.outgoing.telemetry-out.topic=fleetiq/telemetry
mp.messaging.outgoing.telemetry-out.qos=1
mp.messaging.outgoing.telemetry-out.client-id=fleetiq-simulator
mp.messaging.outgoing.telemetry-out.username=${FLEETIQ_MQTT_USERNAME:demo}
mp.messaging.outgoing.telemetry-out.password=${FLEETIQ_MQTT_PASSWORD:simulator-demo-dev}

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.fleetiq.simulator".level=DEBUG
